[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cop31-itu-digital-twin-backend"
version = "0.1.0"
description = "FastAPI backend and LangChain agent for the İTÜ campus monitoring system"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain-core",
    "langchain-openai",
    "langchain-tavily",
    "ddgs",
    "python-dotenv",
    "numpy",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
# Plots for the offline data generator: pip install -e ".[generator]"
generator = ["matplotlib"]

[tool.setuptools.packages.find]
include = ["app*"]
