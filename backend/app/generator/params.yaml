# Generator knobs. These are NOT measurements: they are tuning values that make
# the synthetic data look convincing. Change them, re-run, look at the plots.
#
# people(building, hour) = capacity × day_level × hour_shape × noise

seed: 31

# Gross floor area per person when the building is full. Same for every building,
# so capacity comes only from real size (buildings.csv).
m2_per_person: 10

# Above this share of capacity, a building fills up ever more slowly (it gets crowded)
# instead of hitting a hard ceiling.
crowding_knee: 0.85

noise:
  day_sigma: 0.08     # day-to-day wobble (log-normal, ~±8%)
  hour_sigma: 0.05    # hour-to-hour wobble
  hour_memory: 0.85   # 0 = jittery, close to 1 = slow drifting

# --- Energy, water, waste (shared by all buildings unless a building overrides) ---

energy:
  on_threshold: 0.01         # building counts as "on" (HVAC running, heating at setpoint) above this share of capacity
  lighting_w_m2: 6.0         # installed lighting power (mixed fluorescent)
  lighting_always_on: 0.10   # corridors, stairs, emergency lights
  lighting_full_at: 0.30     # share of capacity at which all lights are on
  plug_base_w_m2: 1.5        # always-on: network, fridges, standby
  plug_w_per_person: 40      # laptops, chargers, coffee machines
  fan_w_m2: 2.0              # ventilation fans while on
  heat_per_person_w: 80      # body heat
  solar_gain: 0.005          # share of sunlight on the floor area that ends up as indoor heat
  heat_loss_w_m2k: 2.5       # heat loss per m² floor per °C indoor-outdoor difference: walls, windows + air leaks (older, poorly insulated)
  ventilation_w_k_per_person: 10   # fresh air (~8 L/s per person) that has to be heated or cooled, while on
  thermal_hours: 12          # thermal mass: how slowly the building follows outdoor temperature
  heat_setpoint_c: 20
  heat_setback_c: 12         # when off (nights, holidays): boiler practically off, just frost/damp protection
  cool_setpoint_c: 25
  cooling_cop: 3.0
  boiler_efficiency: 0.90
  meter_sigma: 0.03          # small meter wobble
  meter_memory: 0.7

water:
  l_per_person_hour: 2.0     # toilets, sinks
  base_l_per_m2_hour: 0.005  # cleaning, leaks

waste:
  kg_per_person_hour: 0.02
  day_sigma: 0.15            # day-to-day wobble of the total
  share_sigma: 0.15          # day-to-day wobble of the split between streams (moves the recycling rate)

# Plausibility ranges for yearly totals (kWh per m² gross floor area). Not İTÜ data:
# just "does this look like a university building at all".
checks:
  elec_kwh_m2: [30, 150]
  gas_kwh_m2: [30, 250]

buildings:
  # Small faculty: classes on lower floors, offices upper. Office-like day, nearly empty at night.
  bbf:
    day_level: {term: 0.55, exam: 0.40, break: 0.20, summer_school: 0.20, summer: 0.10, holiday: 0.02}
    weekend: 0.08          # multiplier on Saturday/Sunday
    night_floor: 0.0       # share of the day level that stays overnight
    plateau: {start: 8.5, end: 18.0, level: 0.80, ramp: 0.7}   # hours; ramp = how soft the edges are
    bumps:
      - {at: 12.5, width: 0.7, height: 0.15}   # lunch
    rain_boost: 0.0        # extra share of people when it rains
    waste_shares: {recyclable: 0.40, organic: 0.15, residual: 0.44, hazardous: 0.01}

  # MED: campus hub. Cafés + common seating on the ground floor (>50% most of the day,
  # full at lunch), lecture halls and offices above.
  meda:
    day_level: {term: 0.90, exam: 0.65, break: 0.25, summer_school: 0.35, summer: 0.12, holiday: 0.03}
    weekend: 0.15
    night_floor: 0.0
    plateau: {start: 8.5, end: 19.5, level: 0.62, ramp: 0.8}
    bumps:
      - {at: 12.6, width: 0.8, height: 0.38}   # lunch rush
      - {at: 16.5, width: 1.2, height: 0.08}   # afternoon coffee
    rain_boost: 0.06
    water_l_per_person_hour: 3.0     # cafés: dishwashing, kitchens
    waste_kg_per_person_hour: 0.035  # cafés: food, cups, packaging
    waste_shares: {recyclable: 0.30, organic: 0.35, residual: 0.345, hazardous: 0.005}

  # Mustafa İnan Library: open 24/7 (OSM), long flat days, packed during finals.
  lib:
    day_level: {term: 0.50, exam: 0.95, break: 0.30, summer_school: 0.30, summer: 0.15, holiday: 0.10}
    weekend: 0.60
    night_floor: 0.08
    plateau: {start: 9.0, end: 23.0, level: 0.80, ramp: 1.5}
    bumps:
      - {at: 15.0, width: 2.5, height: 0.15}   # afternoon study peak
    rain_boost: 0.04
    waste_shares: {recyclable: 0.50, organic: 0.10, residual: 0.395, hazardous: 0.005}   # mostly paper
